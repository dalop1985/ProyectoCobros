{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h4>Mi Perfil</h4>
                <a href="{{ url_for('main.user_dashboard') }}" class="btn btn-sm btn-light">
                    <i class="fas fa-arrow-left"></i> Regresar
                </a>
            </div>
        </div>
        <div class="card-body">
            {% include 'partials/perfil_content.html' %}

            <!-- Sección específica para usuarios normales -->
            {% if usuario.rol == 'user' %}
            <div class="mt-4">
                {% if not tiene_solicitud_pendiente %}
                <button class="btn btn-danger mt-3" data-bs-toggle="modal" data-bs-target="#modalBaja">
                    <i class="fas fa-user-times"></i> Solicitar Baja
                </button>
                {% else %}
                <div class="alert alert-warning mt-3">
                    <i class="fas fa-exclamation-triangle"></i> Tiene una solicitud de baja pendiente
                    <form method="POST" action="{{ url_for('main.cancelar_solicitud') }}" class="mt-2">
                        <button type="submit" class="btn btn-sm btn-secondary">
                            <i class="fas fa-times-circle"></i> Cancelar Solicitud
                        </button>
                    </form>
                </div>
                {% endif %}
            </div>
            {% endif %}
        </div>
    </div>
</div>

<!-- Modal Solicitud Baja -->
<div class="modal fade" id="modalBaja" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="bi bi-person-x"></i> Solicitar Baja del Sistema</h5>
            </div>
            <form method="POST" action="{{ url_for('main.solicitar_baja') }}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Motivo de la baja:</label>
                        <textarea name="motivo" class="form-control" placeholder="Explique el motivo de su solicitud de baja" required rows="4"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-send"></i> Enviar Solicitud
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
