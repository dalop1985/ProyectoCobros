{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-warning">
                <div class="card-header bg-warning text-white">
                    <h4 class="mb-0"><i class="fas fa-clock me-2"></i>Sesión Expirada</h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-clock fa-5x mb-4 text-warning"></i>
                    <h5 class="card-title">Su sesión ha expirado por inactividad</h5>
                    <p>Será redirigido automáticamente a la página de inicio de sesión</p>

                    <div class="mt-4">
                        <a href="{{ url_for('main.login') }}" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i> Volver a Iniciar Sesión
                        </a>
                    </div>
                </div>
                <div class="card-footer text-muted text-center">
                    <small>Redireccionando en <span id="countdown">5</span> segundos...</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Redirección automática con cuenta regresiva
let seconds = 5;
const countdown = setInterval(() => {
    seconds--;
    document.getElementById('countdown').textContent = seconds;
    if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = "{{ url_for('main.login') }}";
    }
}, 1000);
</script>
{% endblock %}
