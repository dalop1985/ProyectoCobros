<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cobros Municipales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <!-- Cargar fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Open+Sans:wght@300;400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Rutas donde NO activar el monitoreo
            const excludedRoutes = [
                "{{ url_for('main.login') }}",
                "{{ url_for('main.session_expired') }}",
                "{{ url_for('main.solicitar_recuperacion_contrasena') }}",
                "{{ url_for('main.establecer_nueva_contrasena') }}",
                "{{ url_for('main.verificar_codigo_recuperacion', token_id=0) }}".replace('/0', '')
            ];

            // Verificar si estamos en ruta excluida
            const currentPath = window.location.pathname;
            const isExcluded = excludedRoutes.some(route => currentPath.startsWith(route));

            if (isExcluded) {
                return;
            }

            // Bandera para evitar múltiples redirecciones
            let sessionExpired = false;
            // Tiempo de verificación (más frecuente que el timeout)
            const checkInterval = 10000; // 10 segundos
            let lastCheck = 0;

            // Función para verificar el estado de la sesión
            const checkSession = () => {
                if (sessionExpired) return;

                // Evitar verificar demasiado rápido
                const now = Date.now();
                if (now - lastCheck < 3000) return;
                lastCheck = now;

                fetch('/check-session', {
                    credentials: 'same-origin',
                    headers: {
                        'Cache-Control': 'no-cache'
                    }
                })
                .then(response => {
                    // Si recibimos una redirección, seguirla directamente
                    if (response.redirected) {
                        sessionExpired = true;
                        window.location.href = response.url;
                        return;
                    }

                    if (!response.ok) {
                        throw new Error('Error en la respuesta del servidor');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && !data.active) {
                        sessionExpired = true;
                        console.log('Sesión expirada, forzando recarga...');
                        // Forzar recarga completa de la página
                        window.location.reload(true);
                    }
                })
                .catch(error => {
                    console.error('Error al verificar sesión:', error);
                });
            };

            // Función para actualizar la actividad
            const updateActivity = () => {
                if (sessionExpired) return;

                fetch('/update-activity', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                    }
                }).catch(error => {
                    console.error('Error al actualizar actividad:', error);
                });
            };

            // Eventos que actualizan la actividad
            const activityEvents = ['keydown', 'click'];
            activityEvents.forEach(event => {
                document.addEventListener(event, () => {
                    if (!sessionExpired) updateActivity();
                });
            });

            // Verificar el estado de la sesión periódicamente
            const sessionChecker = setInterval(checkSession, checkInterval);

            // Verificar inmediatamente al cargar
            setTimeout(checkSession, 1000);

            // Manejar cuando la pestaña gana foco
            window.addEventListener('focus', () => {
                if (!sessionExpired) {
                    updateActivity();
                    checkSession();
                }
            });
        });
    </script>
</body>
</html>
